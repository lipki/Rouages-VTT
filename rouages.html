<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiche de Personnage - Rouages</title>
  <link rel="stylesheet" type="text/css" href="rouages.css">
  <script async="" src="rouages.js"></script>
</head>

<body>

  <div class="sheet-container">

    <div class="sheet">

      <div class="sheet-front">

        <header>
          <h1>Rouages</h1>
        </header>

        <div id='portrait'>
          <img id="avatarimage" name='attr_character_avatar' alt="">
          <div class='overlay' aria-hidden="true"></div>
          <span>Dépose ton avatar</span>
        </div>

        <div class="identity">
          <div class="field">
            <label for="name"><span>NOM</span></label>
            <input type="text" name="attr_name" id="attr_name" required />
          </div>
          <div class="field">
            <label for="age"><span>AGE</span></label>
            <input type="text" name="attr_age" id="attr_age" required />
          </div>
          <div class="field">
            <label for="people"><span>PEUPLE</span></label>
            <input type="text" name="attr_people" id="attr_people" required />
          </div>
          <div class="field">
            <label for="works"><span>MÉTIER</span></label>
            <input type="text" name="attr_works" id="attr_works" required />
          </div>
        </div>

        <div class="main-content">
          <ul class="stats-list">
            <li class="label">
              <span>MUSCULATURE</span>
              <input class="gear" type="text" maxlength="2" name="carac_mus" id="carac_mus" data-stat="mus" required />
            </li>
            <li class="label">
              <span>DEXTÉRITÉ</span>
              <input class="gear" type="text" maxlength="2" name="carac_dex" id="carac_dex" data-stat="dex" required />
            </li>
            <li class="label">
              <span>PERCEPTION</span>
              <input class="gear" type="text" maxlength="2" name="carac_per" id="carac_per" data-stat="per" required />
            </li>
            <li class="label">
              <span>ÉDUCATION</span>
              <input class="gear" type="text" maxlength="2" name="carac_edu" id="carac_edu" data-stat="edu" required />
            </li>
            <li class="label">
              <span>INTUITION</span>
              <input class="gear" type="text" maxlength="2" name="carac_int" id="carac_int" data-stat="int" required />
            </li>
            <li class="label">
              <span>VOLONTÉ</span>
              <input class="gear" type="text" maxlength="2" name="carac_vol" id="carac_vol" data-stat="vol" required />
            </li>
          </ul>

          <div class="icons-grid">
            <div class="icon-box vigueur">
              <input type="text" maxlength="2" name="carac_vigu" id="carac_vigu" data-stat="vigu" required />
              <span>VIGUEUR</span>
            </div>
            <div class="icon-box blessure">
              <input type="text" maxlength="2" name="carac_bles" id="carac_bles" data-stat="bles" required />
              <span>BLESSURES</span>
            </div>
            <div class="icon-box armure">
              <input type="text" maxlength="2" name="carac_armu" id="carac_armu" data-stat="armu" required />
              <span>ARMURE</span>
            </div>
            <div class="icon-box lassitude">
              <input type="text" maxlength="2" name="carac_lass" id="carac_lass" data-stat="lass" required />
              <span>LASSITUDE</span>
            </div>
            <div class="icon-box penetration">
              <input type="text" maxlength="2" name="carac_pene" id="carac_pene" data-stat="pene" required />
              <span>PÉNÉTRATION</span>
            </div>
            <div class="icon-box pi">
              <input type="text" maxlength="2" name="carac_pi" id="carac_pi" data-stat="pi" required />
              <span>PI</span>
            </div>
            <div class="icon-box ingredient">
              <input type="text" maxlength="2" name="carac_ingr" id="carac_ingr" data-stat="ingr" required />
              <span>INGRÉDIENTS</span>
            </div>
            <div class="icon-box atoutpenalite">
              <button id="comp_atout">Atout</button>
              <span class="atoutCounter">0 Atout</span>
              <span class="skillCounter">0 Comp.</span>
              <button id="comp_penalite">Penalité</button>
            </div>
          </div>
        </div>

        <div class="notebook-container">
          <div id="zone_capa">
            <h3><span>CAPACITÉS</span><button class="add-drawer">➕</button></h3>
            <div class="drawers-container"></div>
          </div>
          <div>
            <h3><span>COMPÉTENCES</span></h3>
            <div class="skills-container">
              <div class="skills-list">
                <button data-icon="🛠" id="comp_bricolage">Bricolage</button>
                <button data-icon="🗡" id="comp_brigandage">Brigandage</button>
                <button data-icon="🕶" id="comp_discretion">Discrétion</button>
                <button data-icon="⚟" id="comp_eloquence">Eloquence</button>
                <button data-icon="🕸" id="comp_intrigues">Intrigues</button>
                <button data-icon="🕮" id="comp_legendes">Légendes</button>
                <button data-icon="☤" id="comp_medecine">Médecine</button>
                <button data-icon="☈" id="comp_mobilite">Mobilité</button>
                <button data-icon="☙" id="comp_nature">Nature</button>
                <button data-icon="🏛" id="comp_politique">Politique</button>
                <button data-icon="⚿" id="comp_psychologie">Psychologie</button>
                <button data-icon="🛡" id="comp_resistance">Résistance</button>
                <button data-icon="⚛" id="comp_sciencesabstraites">Scien. Abstraites</button>
                <button data-icon="⚔" id="comp_entrainementsmartiaux">Entr. martiaux</button>
              </div>
              <div class="technique skills-list">
                <h4>Disciplines techniques</h4>
                <button data-icon="☘" id="comp_apothicairerie">Apothicairerie</button>
                <button data-icon="⚗" id="comp_alchimie">Alchimie</button>
                <button data-icon="🕱" id="comp_armurerie">Armurerie</button>
                <button data-icon="⚙" id="comp_mecanique">Mécanique</button>
                <button data-icon="🗲" id="comp_electricite">Electricité</button>
                <button data-icon="☢" id="comp_explosifs">Explosifs</button>
              </div>
            </div>
            <button id="skills-update" type="button">🖋</button>
          </div>
        </div>

        <div class="notebook-container">
          <div>
            <h3><span>EQUIPEMENT</span></h3>
            <textarea class="notebook" name="attr_equi" id="attr_equi"></textarea>
          </div>
          <div id="zone_contacts">
            <h3><span>CONTACTS</span><button class="add-drawer">➕</button></h3>
            <div class="drawers-container"></div>
          </div>
        </div>

      </div>

      <div class="sheet-back">

        <header>
          <h1>Rouages</h1>
        </header>

        <h2>Notes</h2>
        <textarea class="notes"></textarea>

      </div>

      <div class="page-corner"></div>

    </div>

    <div class="historical">
      <h2>Historique</h2>
      <ul></ul>
    </div>

  </div>

  <div class="dice-box"></div>

</body>

</html>
